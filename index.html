<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween 🎃</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #3b145f 0%, #160820 45%, #050208 100%);
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(white 1px, transparent 1px);
      background-size: 45px 45px;
    }

    .fog {
      position: fixed;
      width: 140%;
      height: 250px;
      bottom: -50px;
      left: -20%;
      background: rgba(180, 150, 220, 0.08);
      filter: blur(35px);
      pointer-events: none;
    }

    .card,
    .surprise {
      position: relative;
      width: min(92%, 650px);
      margin: auto;
      text-align: center;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(15, 8, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 70px rgba(0,0,0,0.6);
    }

    .card {
      margin-top: 12vh;
    }

    .pumpkin {
      font-size: 75px;
      animation: float 2s infinite ease-in-out;
    }

    .tag {
      color: #ff8a00;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 12px 0;
    }

    h1 {
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1.15;
      margin: 15px 0;
    }

    h2 {
      font-size: clamp(24px, 6vw, 38px);
      line-height: 1.2;
    }

    p {
      color: #ddd3e5;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #yes {
      background: #ff7800;
      color: white;
      box-shadow: 0 8px 25px rgba(255,120,0,0.35);
    }

    #no {
      background: #302638;
      color: white;
    }

    .surprise {
      display: none;
      margin-top: 7vh;
    }

    .surprise.show {
      display: block;
      animation: appear 0.6s ease;
    }

    .moon {
      font-size: 60px;
    }

    .ghost {
      font-size: 50px;
      margin-top: -5px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      margin: 22px auto;
      border-radius: 18px;
      background: #000;
      object-fit: contain;
    }

    #again {
      background: #ff7800;
      color: white;
      margin-top: 10px;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 500px) {
      .card,
      .surprise {
        padding: 28px 18px;
      }

      .card {
        margin-top: 8vh;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="fog"></div>

  <!-- CÂU HỎI -->
  <main class="card" id="card">

    <div class="pumpkin">🎃</div>

    <div class="tag">
      HALLOWEEN NIGHT
    </div>

    <h1>
      Bạn có muốn đón Halloween cùng mình không?
    </h1>

    <p>
      Có một bất ngờ nhỏ đang chờ bạn... 👻
    </p>

    <div class="buttons">
      <button id="yes">
        Có 🎃
      </button>

      <button id="no">
        Không 😈
      </button>
    </div>

  </main>


  <!-- MÀN HÌNH VIDEO -->
  <section class="surprise" id="surprise">

    <div class="moon">🌕</div>

    <div class="ghost">👻</div>

    <div class="tag">
      HAPPY HALLOWEEN
    </div>

    <h2>
      Vậy thì cùng mình đón Halloween nhé! 🎃
    </h2>

    <!-- VIDEO CỦA BẠN -->
    <video
      id="halloweenVideo"
      controls
      playsinline
      preload="metadata"
    >
      <source src="video.mp4" type="video/mp4">
      Trình duyệt không hỗ trợ video.
    </video>

    <p>
      Chúc bạn có một đêm Halloween thật vui
      và thật nhiều điều bất ngờ ✨
    </p>

    <button id="again">
      Xem lại 🔄
    </button>

  </section>


  <script>

    const card = document.getElementById("card");
    const surprise = document.getElementById("surprise");

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");

    const again = document.getElementById("again");
    const video = document.getElementById("halloweenVideo");


    // BẤM "CÓ"
    yes.addEventListener("click", function () {

      card.style.display = "none";

      surprise.classList.add("show");

      video.currentTime = 0;

      video.play().catch(function () {
        // Nếu trình duyệt chặn tự động phát,
        // người xem chỉ cần bấm Play.
      });

    });


    // BẤM "KHÔNG"
    no.addEventListener("click", function () {

      no.style.position = "fixed";

      no.style.left =
        Math.random() * 70 + 15 + "%";

      no.style.top =
        Math.random() * 65 + 20 + "%";

    });


    // BẤM "XEM LẠI"
    again.addEventListener("click", function () {

      video.pause();

      video.currentTime = 0;

      surprise.classList.remove("show");

      card.style.display = "block";

      no.style.position = "";

      no.style.left = "";

      no.style.top = "";

    });

  </script>

</body>
  </html>
