<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween 🎃</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #3b145f 0%, #160820 45%, #050208 100%);
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(white 1px, transparent 1px);
      background-size: 45px 45px;
    }

    .fog {
      position: fixed;
      width: 140%;
      height: 250px;
      bottom: -50px;
      left: -20%;
      background: rgba(180, 150, 220, 0.08);
      filter: blur(35px);
      pointer-events: none;
    }

    .card,
    .surprise {
      position: relative;
      width: min(92%, 650px);
      margin: auto;
      text-align: center;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(15, 8, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 70px rgba(0,0,0,0.6);
    }

    .card {
      margin-top: 12vh;
    }

    .pumpkin {
      font-size: 75px;
      animation: float 2s infinite ease-in-out;
    }

    .tag {
      color: #ff8a00;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 12px 0;
    }

    h1 {
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1.15;
      margin: 15px 0;
    }

    h2 {
      font-size: clamp(24px, 6vw, 38px);
      line-height: 1.2;
    }

    p {
      color: #ddd3e5;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
